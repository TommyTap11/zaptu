# fly.toml — Zaptu API on Fly.io
# app name is set on first `fly launch` / `fly apps create` (do not deploy without Tom's OK).
# Suggested size: shared-cpu-1x 256MB (~$2.19/mo) or 512MB (~$3.69/mo).
# Volume is optional; without it lead files are ephemeral (stdout JSON still logs each lead).

app = "zaptu-api"
primary_region = "mia"

[build]
  dockerfile = "Dockerfile"

[env]
  HOST = "0.0.0.0"
  PYTHONPATH = "src"
  ZAPTU_MOCK_FORWARDER = "0"
  MOCK_FORWARDING = "false"
  REQUIRE_CONSENT = "true"
  ZAPTU_DATA_DIR = "./data"
  PUBLIC_BASE_URL = "https://api.zaptu.ai"
  CORS_ORIGINS = "https://zaptu.ai,https://www.zaptu.ai"
  RATE_LIMIT_PER_MINUTE = "30"

[http_service]
  internal_port = 8000
  force_https = true
  auto_stop_machines = false
  auto_start_machines = true
  min_machines_running = 1
  processes = ["app"]

  [[http_service.checks]]
    interval = "15s"
    timeout = "2s"
    grace_period = "10s"
    method = "GET"
    path = "/health"

[[vm]]
  size = "shared-cpu-1x"
  memory = "512mb"
