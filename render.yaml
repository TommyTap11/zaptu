services:
  - type: web
    name: zaptu
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: python src/aslc/server.py
    healthCheckPath: /health
    envVars:
      - key: PYTHONPATH
        value: src
      - key: HOST
        value: 0.0.0.0
      - key: MOCK_FORWARDING
        value: "true"
      - key: REQUIRE_CONSENT
        value: "true"
      - key: DATA_DIR
        value: /var/data
      - key: API_TOKEN
        generateValue: true
      - key: LEAD_WEBHOOK_URL
        sync: false
      - key: LEAD_WEBHOOK_TOKEN
        sync: false
